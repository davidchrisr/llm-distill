[package]
name = "llm-distill"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "distill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
